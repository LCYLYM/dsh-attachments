<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Better Attach · Integration lab</title><link rel="stylesheet" href="/lib/ui.css"><link rel="stylesheet" href="/demo/style.css"></head><body>
<aside id="sidebar"><div class="brand"><span class="brand-glyph">↳</span> Better Attach <span class="version">0.2</span></div><button id="new-chat" class="side-new">＋ 新对话</button><div class="side-section">工作区 <span>WORKSPACES</span></div><div id="workspaces"><div class="workspace-row selected">▱ &nbsp; attachment-lab <span>2</span></div></div><div class="sessions"><button data-session="conversation-a" class="selected">附件交互验收 <span>当前</span></button><button data-session="conversation-b">另一段对话</button></div><div class="side-guide"><div class="drop-mark">⌑</div><strong>文件夹，放对地方</strong><p>拖到对话 → 添加附件<br>拖到侧栏 → 导入工作区</p><small>侧栏导入创建副本，不会关联原目录。</small></div><div class="sidebar-bottom"><div id="sidebar-import"></div><div class="side-foot"><button id="theme">◐ &nbsp; 切换外观</button><button id="locale">EN</button></div></div></aside>
<main id="conversation"><header class="topbar"><div><span class="breadcrumb">attachment-lab</span><span class="slash">/</span><strong id="conversation-title">附件交互验收</strong></div><span class="lab-tag"><span></span> 本地集成夹具 · 非真实 DSH</span></header>
<div class="conversation-scroll"><section class="intro"><div class="eyebrow">BETTER ATTACH</div><h1>拖进来，然后继续。</h1><p>文件留在该留的地方。<br>图片可预览，目录有结构，每次导入都有清楚的去向。</p><div class="demo-actions"><button id="sample-project">▱ &nbsp; 试用示例文件夹</button><button id="sample-files">▤ &nbsp; 试用图片与文件</button><button id="test-note">测试说明 ↗</button></div><div class="tiny-note">示例按钮创建浏览器 File；上传后会真实写入本机临时目录。</div></section><section id="messages" aria-live="polite"></section></div>
<div class="composer-area"><div id="rail"></div><section id="composer" data-composer-card><textarea id="draft" rows="3" placeholder="添加文件，或说说你希望检查什么…" aria-label="消息草稿"></textarea><div class="composer-tools"><div id="toolbar"></div><div class="right-controls"><span>无模型连接</span><button id="send" aria-label="发送并验证落盘">↑</button></div></div></section><div class="composer-hint">未发送文件只在浏览器页面中保留。点击发送验证落盘，不会调用任何模型。</div></div>
</main><script type="module" src="/demo/app.js"></script></body></html>
